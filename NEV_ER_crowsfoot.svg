<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1000" viewBox="0 0 1320 1000" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <!-- crow's foot (many) marker -->
    <marker id="many" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M2 9 L16 2 M2 9 L16 9 M2 9 L16 16" stroke="#5B7FA6" stroke-width="1.4" fill="none"/>
    </marker>
    <!-- one marker (bar) -->
    <marker id="one" viewBox="0 0 12 18" refX="6" refY="9" markerWidth="12" markerHeight="18" orient="auto">
      <path d="M6 3 L6 15" stroke="#5B7FA6" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="1320" height="1000" fill="#FBFAF8"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#1A1A18">NEV 沙盘 SQL Schema · Crow's Foot Notation</text>
  <text x="40" y="72" font-size="13" fill="#6B6A66">表=框(PK 🔑 / FK 🔗) · 竖线=「一」· 鸦爪=「多」· 实线=声明式FK · 虚线=概念维度关联</text>
  <line x1="40" y1="86" x2="1280" y2="86" stroke="#E0DED8"/>

  <!-- ============ model_dim ============ -->
  <g>
    <rect x="60" y="140" width="250" height="250" rx="6" fill="#FFFFFF" stroke="#5B7FA6" stroke-width="1.5"/>
    <rect x="60" y="140" width="250" height="30" rx="6" fill="#26456B"/>
    <text x="72" y="160" font-size="14" font-weight="700" fill="#FFF">model_dim</text>
    <text x="300" y="160" font-size="11" fill="#BcD" text-anchor="end" fill-opacity="0.8">事件驱动</text>
    <text x="72" y="190" font-size="11.5" fill="#26456B">🔑 model_id  PK</text>
    <line x1="60" y1="200" x2="310" y2="200" stroke="#E0DED8"/>
    <text x="72" y="220" font-size="11" fill="#333">brand, model_name, variant</text>
    <text x="72" y="240" font-size="11" fill="#333">region_archetype</text>
    <text x="72" y="260" font-size="11" fill="#333">powertrain_focus {BEV,Multi}</text>
    <text x="72" y="280" font-size="11" fill="#333">price_tier {Premium,Mass}</text>
    <text x="72" y="300" font-size="11" fill="#333">quadrant {Q1..Q4}</text>
    <text x="72" y="320" font-size="11" fill="#333">list_price, battery_kwh, range</text>
    <text x="72" y="340" font-size="11" fill="#0F6E56">batt_dev / adas_dev / chip_dev</text>
    <text x="72" y="360" font-size="11" fill="#333">charging_speed_kw, rating</text>
    <text x="72" y="380" font-size="10.5" fill="#888">rd_score_display (仅展示)</text>
  </g>

  <!-- ============ sales_transactions ============ -->
  <g>
    <rect x="440" y="150" width="250" height="150" rx="6" fill="#FFFFFF" stroke="#5B7FA6" stroke-width="1.5"/>
    <rect x="440" y="150" width="250" height="30" rx="6" fill="#26456B"/>
    <text x="452" y="170" font-size="14" font-weight="700" fill="#FFF">sales_transactions</text>
    <text x="680" y="170" font-size="11" fill="#BcD" text-anchor="end">日频</text>
    <text x="452" y="200" font-size="11.5" fill="#26456B">🔑 transaction_id  PK</text>
    <text x="452" y="220" font-size="11.5" fill="#9A4B12">🔗 model_id  FK</text>
    <line x1="440" y1="230" x2="690" y2="230" stroke="#E0DED8"/>
    <text x="452" y="250" font-size="11" fill="#333">txn_date, region</text>
    <text x="452" y="272" font-size="11" fill="#C0392B">unit_price (P)  · A类</text>
    <text x="452" y="292" font-size="11" fill="#C0392B">quantity (Q)  · A类</text>
  </g>
  <!-- FK link model_dim (1) → (many) sales -->
  <line x1="310" y1="225" x2="440" y2="225" stroke="#5B7FA6" stroke-width="1.5" marker-start="url(#one)" marker-end="url(#many)"/>
  <text x="360" y="216" font-size="11" fill="#26456B" font-style="italic">拥有</text>

  <!-- ============ macro_shocks_log ============ -->
  <g>
    <rect x="1000" y="140" width="270" height="180" rx="6" fill="#FFFFFF" stroke="#5B7FA6" stroke-width="1.5"/>
    <rect x="1000" y="140" width="270" height="30" rx="6" fill="#26456B"/>
    <text x="1012" y="160" font-size="14" font-weight="700" fill="#FFF">macro_shocks_log</text>
    <text x="1260" y="160" font-size="11" fill="#BcD" text-anchor="end">全国日频</text>
    <text x="1012" y="190" font-size="11.5" fill="#26456B">🔑 shock_date  PK</text>
    <line x1="1000" y1="200" x2="1270" y2="200" stroke="#E0DED8"/>
    <text x="1012" y="220" font-size="11" fill="#C0392B">lithium_price_index</text>
    <text x="1012" y="240" font-size="11" fill="#C0392B">nickel_cobalt / rare_earth</text>
    <text x="1012" y="260" font-size="11" fill="#C0392B">steel_aluminum / semiconductor</text>
    <text x="1012" y="280" font-size="11" fill="#333">carbon_credit_price, interest_rate</text>
    <text x="1012" y="300" font-size="11" fill="#333">upstream_policy_index, subsidy</text>
  </g>

  <!-- ============ supply_chain_costs ============ -->
  <g>
    <rect x="1000" y="400" width="270" height="160" rx="6" fill="#FFFFFF" stroke="#5B7FA6" stroke-width="1.5"/>
    <rect x="1000" y="400" width="270" height="30" rx="6" fill="#26456B"/>
    <text x="1012" y="420" font-size="14" font-weight="700" fill="#FFF">supply_chain_costs</text>
    <text x="1260" y="420" font-size="11" fill="#BcD" text-anchor="end">日频</text>
    <text x="1012" y="450" font-size="11.5" fill="#26456B">🔑 batch_id  PK</text>
    <line x1="1000" y1="460" x2="1270" y2="460" stroke="#E0DED8"/>
    <text x="1012" y="480" font-size="11" fill="#333">cost_date, region, quadrant</text>
    <text x="1012" y="500" font-size="11" fill="#333">component_type {battery,chip…}</text>
    <text x="1012" y="520" font-size="11" fill="#C0392B">bom_cost_per_unit (C) · A类</text>
    <text x="1012" y="540" font-size="11" fill="#333">battery_bom_share, auto_cogs</text>
  </g>
  <!-- shock (1) → (many) supply cost : 概念(date+commodity)-> dashed -->
  <line x1="1135" y1="320" x2="1135" y2="400" stroke="#9A9892" stroke-width="1.2" stroke-dasharray="5 4" marker-start="url(#one)" marker-end="url(#many)"/>
  <text x="1142" y="365" font-size="10.5" fill="#9A9892" font-style="italic">传导γ (date/商品)</text>

  <!-- ============ regional_infra ============ -->
  <g>
    <rect x="60" y="560" width="270" height="170" rx="6" fill="#FFFFFF" stroke="#5B7FA6" stroke-width="1.5"/>
    <rect x="60" y="560" width="270" height="30" rx="6" fill="#26456B"/>
    <text x="72" y="580" font-size="14" font-weight="700" fill="#FFF">regional_infra</text>
    <text x="320" y="580" font-size="11" fill="#BcD" text-anchor="end">低频/季度</text>
    <text x="72" y="610" font-size="11.5" fill="#26456B">🔑 region + period  PK (复合)</text>
    <line x1="60" y1="620" x2="330" y2="620" stroke="#E0DED8"/>
    <text x="72" y="640" font-size="11" fill="#333">station/port_count, fast_share</text>
    <text x="72" y="660" font-size="11" fill="#333">is_swap, swap_partnership</text>
    <text x="72" y="680" font-size="11" fill="#0F6E56">local_battery_cluster_index (γ)</text>
    <text x="72" y="700" font-size="11" fill="#0F6E56">gov_investment / fiscal / tax</text>
    <text x="72" y="720" font-size="11" fill="#0F6E56">local_market_size = TAM 天花板</text>
  </g>

  <!-- ============ financial_snapshots ============ -->
  <g>
    <rect x="460" y="600" width="290" height="230" rx="6" fill="#FFFFFF" stroke="#5B7FA6" stroke-width="1.5"/>
    <rect x="460" y="600" width="290" height="30" rx="6" fill="#26456B"/>
    <text x="472" y="620" font-size="14" font-weight="700" fill="#FFF">financial_snapshots</text>
    <text x="740" y="620" font-size="11" fill="#BcD" text-anchor="end">截面</text>
    <text x="472" y="650" font-size="11.5" fill="#26456B">🔑 region+quadrant+period PK(复合)</text>
    <line x1="460" y1="660" x2="750" y2="660" stroke="#E0DED8"/>
    <text x="472" y="680" font-size="11" fill="#C0392B">total/automotive_revenue · A类</text>
    <text x="472" y="700" font-size="11" fill="#333">service/regulatory_credit_rev</text>
    <text x="472" y="720" font-size="11" fill="#C0392B">EBIT, net_income, gross_profit · A类</text>
    <text x="472" y="740" font-size="11" fill="#333">total_assets, D&amp;A, tax_rate</text>
    <text x="472" y="760" font-size="11" fill="#0F6E56">equity, interest_debt, cash</text>
    <text x="472" y="780" font-size="11" fill="#0F6E56">rd_ratio, capex, selling_expense</text>
    <text x="472" y="800" font-size="11" fill="#333">total_deliveries, fcf</text>
  </g>

  <!-- links -->
  <!-- regional_infra (1) region → (many) financial : dashed region -->
  <line x1="330" y1="645" x2="460" y2="680" stroke="#9A9892" stroke-width="1.2" stroke-dasharray="5 4" marker-start="url(#one)" marker-end="url(#many)"/>
  <text x="352" y="648" font-size="10.5" fill="#9A9892" font-style="italic">region</text>
  <!-- financial (1) region+quadrant → (many) supply_chain : dashed -->
  <line x1="750" y1="700" x2="1000" y2="500" stroke="#9A9892" stroke-width="1.2" stroke-dasharray="5 4" marker-start="url(#one)" marker-end="url(#many)"/>
  <text x="850" y="590" font-size="10.5" fill="#9A9892" font-style="italic">region×quadrant</text>
  <!-- sales (many) → (1) financial : 交付量聚合 dashed -->
  <line x1="560" y1="300" x2="580" y2="600" stroke="#9A9892" stroke-width="1.2" stroke-dasharray="5 4" marker-start="url(#many)" marker-end="url(#one)"/>
  <text x="586" y="450" font-size="10.5" fill="#9A9892" font-style="italic">Σquantity → total_deliveries</text>

  <!-- legend bottom -->
  <rect x="60" y="870" width="1210" height="90" rx="8" fill="#F4F3F0" stroke="#DAD8D2"/>
  <text x="80" y="896" font-size="12.5" font-weight="700" fill="#1A1A18">图例</text>
  <line x1="80" y1="912" x2="130" y2="912" stroke="#5B7FA6" stroke-width="1.5" marker-start="url(#one)" marker-end="url(#many)"/>
  <text x="140" y="916" font-size="11" fill="#444">实线 + 竖线/鸦爪 = 声明式外键 (一对多)，仅 sales.model_id → model_dim</text>
  <line x1="80" y1="936" x2="130" y2="936" stroke="#9A9892" stroke-width="1.2" stroke-dasharray="5 4" marker-start="url(#one)" marker-end="url(#many)"/>
  <text x="140" y="940" font-size="11" fill="#444">虚线 = 概念维度关联 (region / quadrant / date)，SQLite 未声明 FK，用于回归 GROUP BY 与 RAG 硬过滤 / 聚合</text>
  <text x="700" y="916" font-size="11" fill="#C0392B">红字 = A 类因果变量(进回归)</text>
  <text x="700" y="940" font-size="11" fill="#0F6E56">绿字 = B 类画像 / 禀赋 / 生态投资</text>
  <text x="980" y="916" font-size="11" fill="#26456B">🔑 主键 / 复合主键　🔗 外键</text>
  <text x="980" y="940" font-size="11" fill="#444">复合主键维持 3NF，不过度拆表</text>
</svg>
