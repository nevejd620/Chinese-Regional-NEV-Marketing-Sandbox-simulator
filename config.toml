# NEV 沙盘 · Streamlit 主题与服务设置
#
# 配色主题：绿色科技。Phase 4 合页时由 Phase 1 的蓝 #185FA5 改为翡翠绿 #12A47A。
#   过宪章 §8 变更闸门：非修 bug、非加精度，属"提升趣味/直觉"（第三种允许的改动）——
#   原主色与内容色（象限色）混淆，用户分不清"这是控件"还是"这是数据"。
#
# 全站配色规则（四类颜色各司其职，没有一个颜色身兼两职）：
#   绿     = 你能操作的东西（滑块 / 开关 / 按钮 / 选中态 / A 段）← 即本文件的 primaryColor
#   象限色 = 你是谁（象限地图卡片 / 图 B 的"你" / 图 C 的散点）
#   石墨灰 = 别人（对手散点 / B 段色带）
#   红     = 零轴与警示
#
# 四象限色板【不在此处】—— 见 copy_cn.QUAD_COLOR（单一真相源），
# 象限地图与图 B/C 共用同一处定义，保证卡片颜色与散点颜色一一对应。

[theme]
base                     = "light"     # 显式声明浅色基底，不跟随浏览器深色偏好
primaryColor             = "#12A47A"   # 主色：翡翠绿
backgroundColor          = "#FAFCFB"   # 页面底：极浅冷白，带一丝绿调
secondaryBackgroundColor = "#EDF4F1"   # 卡片 / 侧栏：浅灰绿
textColor                = "#14261F"   # 正文：深墨绿，比纯黑柔和
font                     = "sans serif"

[server]
headless             = true
enableXsrfProtection = true            # 沿用 Phase 1，勿删

[browser]
gatherUsageStats = false
