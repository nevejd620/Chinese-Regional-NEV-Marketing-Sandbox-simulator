<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="1280" height="880" fill="#FBFAF8"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#1A1A18">NEV 沙盘 SQL Schema · Chen's Notation (ER 图)</text>
  <text x="40" y="72" font-size="13" fill="#6B6A66">实体=矩形 · 属性=椭圆(下划线=主键) · 关系=菱形 · 基数标于连线</text>
  <line x1="40" y1="86" x2="1240" y2="86" stroke="#E0DED8"/>

  <!-- legend -->
  <rect x="40" y="100" width="16" height="12" fill="#EAF1FB" stroke="#5B7FA6"/><text x="62" y="110" font-size="11" fill="#444">强实体</text>
  <ellipse cx="128" cy="106" rx="16" ry="8" fill="#FFF" stroke="#8A8880"/><text x="150" y="110" font-size="11" fill="#444">属性</text>
  <path d="M210 106 l14 -8 l14 8 l-14 8 z" fill="#FDECE4" stroke="#C98A6A"/><text x="244" y="110" font-size="11" fill="#444">关系</text>
  <text x="300" y="110" font-size="11" fill="#444">下划线属性 = 主键 (PK) / 复合主键</text>

  <!-- ============ MODEL_DIM entity (center-left) ============ -->
  <rect x="120" y="200" width="150" height="60" rx="2" fill="#EAF1FB" stroke="#5B7FA6" stroke-width="1.5"/>
  <text x="195" y="235" font-size="15" font-weight="700" fill="#26456B" text-anchor="middle">model_dim</text>
  <!-- a few key attributes -->
  <ellipse cx="120" cy="150" rx="42" ry="15" fill="#FFF" stroke="#8A8880"/><text x="120" y="154" font-size="10.5" text-anchor="middle" text-decoration="underline">model_id</text>
  <line x1="140" y1="163" x2="160" y2="200" stroke="#8A8880"/>
  <ellipse cx="40" cy="215" rx="40" ry="14" fill="#FFF" stroke="#8A8880"/><text x="40" y="219" font-size="10" text-anchor="middle">quadrant</text>
  <line x1="80" y1="215" x2="120" y2="222" stroke="#8A8880"/>
  <ellipse cx="46" cy="262" rx="44" ry="14" fill="#E2EFDA" stroke="#8A8880"/><text x="46" y="266" font-size="9.5" text-anchor="middle">batt/adas/chip_dev</text>
  <line x1="88" y1="258" x2="120" y2="245" stroke="#8A8880"/>
  <ellipse cx="150" cy="300" rx="42" ry="14" fill="#FFF" stroke="#8A8880"/><text x="150" y="304" font-size="10" text-anchor="middle">list_price</text>
  <line x1="160" y1="286" x2="180" y2="260" stroke="#8A8880"/>

  <!-- ============ SALES relationship (Chen: sale as relationship between model & time/region) ============ -->
  <path d="M470 230 l40 -26 l40 26 l-40 26 z" fill="#FDECE4" stroke="#C98A6A" stroke-width="1.5"/>
  <text x="510" y="234" font-size="12" font-weight="700" fill="#9A4B12" text-anchor="middle">SALES</text>
  <line x1="270" y1="230" x2="470" y2="230" stroke="#5B7FA6" stroke-width="1.3"/>
  <text x="300" y="222" font-size="11" fill="#26456B">N</text>
  <text x="452" y="222" font-size="11" fill="#26456B">1</text>
  <!-- sales attributes -->
  <ellipse cx="510" cy="150" rx="46" ry="14" fill="#FFF" stroke="#8A8880"/><text x="510" y="154" font-size="10" text-anchor="middle" text-decoration="underline">transaction_id</text>
  <line x1="510" y1="164" x2="510" y2="204" stroke="#8A8880"/>
  <ellipse cx="620" cy="176" rx="40" ry="14" fill="#FDECE4" stroke="#8A8880"/><text x="620" y="180" font-size="10" text-anchor="middle">unit_price P</text>
  <line x1="588" y1="186" x2="540" y2="212" stroke="#8A8880"/>
  <ellipse cx="628" cy="284" rx="40" ry="14" fill="#FDECE4" stroke="#8A8880"/><text x="628" y="288" font-size="10.5" text-anchor="middle">quantity Q</text>
  <line x1="596" y1="276" x2="540" y2="248" stroke="#8A8880"/>

  <!-- ============ MACRO_SHOCKS_LOG ============ -->
  <rect x="900" y="150" width="180" height="60" rx="2" fill="#EAF1FB" stroke="#5B7FA6" stroke-width="1.5"/>
  <text x="990" y="185" font-size="14" font-weight="700" fill="#26456B" text-anchor="middle">macro_shocks_log</text>
  <ellipse cx="880" cy="110" rx="42" ry="14" fill="#FFF" stroke="#8A8880"/><text x="880" y="114" font-size="10" text-anchor="middle" text-decoration="underline">shock_date</text>
  <line x1="905" y1="122" x2="945" y2="150" stroke="#8A8880"/>
  <ellipse cx="1120" cy="120" rx="52" ry="15" fill="#FDECE4" stroke="#8A8880"/><text x="1120" y="124" font-size="9" text-anchor="middle">lithium/nickel/rare_earth…</text>
  <line x1="1085" y1="132" x2="1040" y2="152" stroke="#8A8880"/>
  <ellipse cx="1130" cy="192" rx="48" ry="14" fill="#FDECE4" stroke="#8A8880"/><text x="1130" y="196" font-size="9" text-anchor="middle">semiconductor_index</text>
  <line x1="1082" y1="192" x2="1080" y2="185" stroke="#8A8880"/>
  <!-- relation: shock AFFECTS cost -->
  <text x="900" y="240" font-size="11" fill="#6B6A66" font-style="italic">(全国日频，无区域/象限)</text>

  <!-- ============ SUPPLY_CHAIN_COSTS ============ -->
  <rect x="880" y="360" width="190" height="60" rx="2" fill="#EAF1FB" stroke="#5B7FA6" stroke-width="1.5"/>
  <text x="975" y="395" font-size="14" font-weight="700" fill="#26456B" text-anchor="middle">supply_chain_costs</text>
  <ellipse cx="860" cy="330" rx="40" ry="14" fill="#FFF" stroke="#8A8880"/><text x="860" y="334" font-size="10" text-anchor="middle" text-decoration="underline">batch_id</text>
  <line x1="885" y1="342" x2="920" y2="360" stroke="#8A8880"/>
  <ellipse cx="1120" cy="330" rx="48" ry="14" fill="#FDECE4" stroke="#8A8880"/><text x="1120" y="334" font-size="9.5" text-anchor="middle">component_type</text>
  <line x1="1075" y1="340" x2="1050" y2="360" stroke="#8A8880"/>
  <ellipse cx="1128" cy="404" rx="48" ry="14" fill="#FDECE4" stroke="#8A8880"/><text x="1128" y="408" font-size="9" text-anchor="middle">bom_cost / batt_share</text>
  <line x1="1080" y1="404" x2="1070" y2="398" stroke="#8A8880"/>
  <!-- SHOCK -> COST relationship diamond -->
  <path d="M900 270 l46 -24 l46 24 l-46 24 z" fill="#FDECE4" stroke="#C98A6A" stroke-width="1.5"/>
  <text x="946" y="274" font-size="11" font-weight="700" fill="#9A4B12" text-anchor="middle">传导 γ</text>
  <line x1="946" y1="210" x2="946" y2="246" stroke="#5B7FA6" stroke-width="1.3"/><text x="952" y="232" font-size="11" fill="#26456B">1</text>
  <line x1="946" y1="294" x2="960" y2="360" stroke="#5B7FA6" stroke-width="1.3"/><text x="952" y="330" font-size="11" fill="#26456B">N</text>

  <!-- ============ REGIONAL_INFRA ============ -->
  <rect x="140" y="470" width="180" height="60" rx="2" fill="#EAF1FB" stroke="#5B7FA6" stroke-width="1.5"/>
  <text x="230" y="498" font-size="14" font-weight="700" fill="#26456B" text-anchor="middle">regional_infra</text>
  <text x="230" y="516" font-size="10" fill="#6B6A66" text-anchor="middle">(低频/季度)</text>
  <ellipse cx="120" cy="430" rx="52" ry="14" fill="#FFF" stroke="#8A8880"/><text x="120" y="434" font-size="9.5" text-anchor="middle" text-decoration="underline">region + period</text>
  <line x1="150" y1="442" x2="185" y2="470" stroke="#8A8880"/>
  <ellipse cx="60" cy="500" rx="52" ry="15" fill="#E2EFDA" stroke="#8A8880"/><text x="60" y="504" font-size="8.5" text-anchor="middle">batt_cluster/gov_invest</text>
  <line x1="112" y1="500" x2="140" y2="500" stroke="#8A8880"/>
  <ellipse cx="150" cy="568" rx="52" ry="14" fill="#E2EFDA" stroke="#8A8880"/><text x="150" y="572" font-size="8.5" text-anchor="middle">local_market_size (TAM)</text>
  <line x1="176" y1="556" x2="210" y2="530" stroke="#8A8880"/>

  <!-- ============ FINANCIAL_SNAPSHOTS ============ -->
  <rect x="500" y="560" width="200" height="62" rx="2" fill="#EAF1FB" stroke="#5B7FA6" stroke-width="1.5"/>
  <text x="600" y="588" font-size="14" font-weight="700" fill="#26456B" text-anchor="middle">financial_snapshots</text>
  <text x="600" y="607" font-size="10" fill="#6B6A66" text-anchor="middle">(区域×象限截面)</text>
  <ellipse cx="470" cy="520" rx="70" ry="15" fill="#FFF" stroke="#8A8880"/><text x="470" y="524" font-size="9" text-anchor="middle" text-decoration="underline">region+quadrant+period</text>
  <line x1="510" y1="532" x2="545" y2="560" stroke="#8A8880"/>
  <ellipse cx="410" cy="600" rx="54" ry="15" fill="#FDECE4" stroke="#8A8880"/><text x="410" y="604" font-size="8.5" text-anchor="middle">revenue/EBIT/net_income</text>
  <line x1="464" y1="600" x2="500" y2="595" stroke="#8A8880"/>
  <ellipse cx="560" cy="672" rx="56" ry="15" fill="#E2EFDA" stroke="#8A8880"/><text x="560" y="676" font-size="8.5" text-anchor="middle">rd_ratio/capex/selling_exp</text>
  <line x1="565" y1="657" x2="580" y2="622" stroke="#8A8880"/>
  <ellipse cx="720" cy="660" rx="50" ry="15" fill="#E2EFDA" stroke="#8A8880"/><text x="720" y="664" font-size="8.5" text-anchor="middle">debt/equity/cash</text>
  <line x1="700" y1="646" x2="650" y2="622" stroke="#8A8880"/>

  <!-- logical links region/quadrant (dashed = 概念维度关联, 非声明FK) -->
  <line x1="320" y1="500" x2="500" y2="575" stroke="#9A9892" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="370" y="548" font-size="10" fill="#9A9892" font-style="italic">region 维度</text>
  <line x1="700" y1="590" x2="880" y2="400" stroke="#9A9892" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="760" y="500" font-size="10" fill="#9A9892" font-style="italic">region×quadrant 维度</text>
  <line x1="600" y1="256" x2="600" y2="560" stroke="#9A9892" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="606" y="410" font-size="10" fill="#9A9892" font-style="italic">交付量聚合 Σquantity</text>

  <text x="40" y="820" font-size="11.5" fill="#6B6A66">实线 = 声明式外键 (sales.model_id → model_dim)；虚线 = 概念维度关联 (region/quadrant/date，SQLite 未必声明 FK，聚合/JOIN 用)。</text>
  <text x="40" y="842" font-size="11.5" fill="#6B6A66">属性椭圆：白=标识/因果 · 橙=A类因果原语 · 绿=B类潜变量画像。Chen 记法下「一笔销售」视为 model_dim 与时间/区域的关系实例。</text>
</svg>
